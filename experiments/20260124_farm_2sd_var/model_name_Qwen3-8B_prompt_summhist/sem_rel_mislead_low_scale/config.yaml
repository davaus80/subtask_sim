actions:
- id: 0
  name: Field_1
  names_path: base_configs/action_name_lists/semantic/farm/sem_farm_bad.json
- id: 1
  name: Field_2
  names_path: base_configs/action_name_lists/semantic/farm/sem_farm_neutral.json
- id: 2
  name: Field_3
  names_path: base_configs/action_name_lists/semantic/farm/sem_farm_good.json
agent:
  max_new_tokens: 200
  model_name: Qwen/Qwen3-8B
  temperature: 1.0
  thinking_budget: 150
  type: mono_llm
experiment:
  replicates: 10
  time_horizon: 10
paths:
  experiment_dir: base_configs/farming_basic
  log_file: experiments/20260124_farm_2sd_var/model_name_Qwen3-8B_prompt_summhist/sem_rel_mislead_low_scale/output.log
subtasks:
- id: 0
  name: DeterministicFarmBandit
  params:
    actions:
    - id: 0
      mean: 0.75
      std_dev: 0.125
    - id: 1
      mean: 0.5
      std_dev: 0.125
    - id: 2
      mean: 0.25
      std_dev: 0.125
  type: bandit
world:
  action_suffix: Field
  prompt_template_path: src/templates/budget_summhist_v1.jinja2
  task_prompt: You are a farmer who owns 3 fields. Each action corresponds to planting
    your crop in a different field. Each field is associated with a Gaussian distribution
    with a fixed but unknown mean. At each time step, you will select a field and
    receive a reward drawn from the associated distribution. Your goal is to maximize
    your reward across all of your turns.
