actions:
- id: 0
  name: Field_1
  names_path: base_configs/action_name_lists/sentiment/positive.json
- id: 1
  name: Field_2
  names_path: base_configs/action_name_lists/sentiment/neutral.json
- id: 2
  name: Field_3
  names_path: base_configs/action_name_lists/sentiment/negative.json
agent:
  max_new_tokens: 200
  model_name: Qwen/Qwen3-32B
  temperature: 1.0
  thinking_budget: 150
  type: mono_llm
experiment:
  replicates: 10
  time_horizon: 10
paths:
  experiment_dir: base_configs/farming_basic
  log_file: experiments/20260124_abandit_4sd_var/model_name_Qwen3-32B_prompt_summhist/sent_helpful_high_scale/output.log
subtasks:
- id: 0
  name: DeterministicAbstractBandit
  params:
    actions:
    - id: 0
      mean: 75
      std_dev: 6.25
    - id: 1
      mean: 50
      std_dev: 6.25
    - id: 2
      mean: 25
      std_dev: 6.25
  type: bandit
world:
  action_suffix: Arm
  prompt_template_path: src/templates/budget_summhist_v1.jinja2
  task_prompt: You are faced with a 3-armed bandit problem.  Each action corresponds
    to pulling a specific arm. Each arm is associated with a Gaussian distribution
    with a fixed but unknown mean. At each time step, you will select a field and
    receive a reward drawn from the associated distribution. Your goal is to select
    which arm to pull in order to maximize your reward across all of your turns.
