actions:
- id: 0
  name: Field_1
  names_path: base_configs/action_name_lists/sentiment/negative.json
- id: 1
  name: Field_2
  names_path: base_configs/action_name_lists/sentiment/neutral.json
- id: 2
  name: Field_3
  names_path: base_configs/action_name_lists/sentiment/positive.json
agent:
  max_new_tokens: 200
  model_name: Qwen/Qwen3-32B
  temperature: 1.0
  thinking_budget: 150
  type: mono_llm
experiment:
  replicates: 10
  scalesweep: true
  time_horizon: 30
paths:
  experiment_dir: base_configs/farming_basic
  log_file: experiments/20260320_farm_scalesweep_novar/model_name_Qwen3-32B/sent_new_mislead_scale1.4/output.log
subtasks:
- id: 0
  name: DeterministicFarmBandit
  params:
    actions:
    - id: 0
      mean: 1.4
      std_dev: 0
    - id: 1
      mean: 0.0
      std_dev: 0
    - id: 2
      mean: 0.0
      std_dev: 0
  type: bandit
world:
  action_suffix: Field
  prompt_template_path: src/templates/budget_summhist_v1.jinja2
  task_prompt: You are a farmer who owns 3 fields. Each action corresponds to planting
    your crop in a different field. Each field is associated with a Gaussian distribution
    with a fixed but unknown mean. At each time step, you will select a field and
    receive a reward drawn from the associated distribution. Your goal is to maximize
    your reward across all of your turns.
