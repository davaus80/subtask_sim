subtasks: 
  - name: DeterministicFarmBandit
    type: bandit
    params:
      actions:
        - name: "John's Field"
          mean: 100
          std_dev: 0
        - name: "Dave's Field"
          mean: 50
          std_dev: 0
        - name: "Mark's Field"
          mean: 200
          std_dev: 0
agent: 
  type: mono_llm
  model_name: "Qwen/Qwen3-8B"
world:
  prompt_template_path: src/templates/v1_w_hist.jinja2
  task_prompt: "You are a farmer who owns 3 fields. Each field has a specified reward that it will return. Your goal is to select which field to plant in in order to maximize your reward across all of your turns."
experiment:
  time_horizon: 10