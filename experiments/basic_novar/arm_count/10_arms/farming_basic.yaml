subtasks: 
  - name: DeterministicFarmBandit
    type: bandit
    params:
      actions:
        - name: "Field_1"
          mean: 100
          std_dev: 0
        - name: "Field_2"
          mean: 50
          std_dev: 0
        - name: "Field_3"
          mean: 200
          std_dev: 0
        - name: "Field_4"
          mean: 25
          std_dev: 0
        - name: "Field_5"
          mean: 150
          std_dev: 0
        - name: "Field_6"
          mean: 150
          std_dev: 0
        - name: "Field_7"
          mean: 50
          std_dev: 0
        - name: "Field_8"
          mean: 10
          std_dev: 0
        - name: "Field_9"
          mean: 250
          std_dev: 0
        - name: "Field_10"
          mean: 100
          std_dev: 0
agent: 
  type: mono_llm
  model_name: "Qwen/Qwen2.5-32B-Instruct"
world:
  prompt_template_path: src/templates/v1_w_hist.jinja2
  task_prompt: "You are a farmer who owns 10 fields. Each field has a specified reward that it will return. Your goal is to select which field to plant in in order to maximize your reward across all of your turns."
experiment:
  time_horizon: 10