actions:
- id: 0
  name: Field_1
  names_path: base_configs/action_name_lists/ordinal/ordinal_good.json
- id: 1
  name: Field_2
  names_path: base_configs/action_name_lists/ordinal/ordinal_neutral.json
- id: 2
  name: Field_3
  names_path: base_configs/action_name_lists/ordinal/ordinal_bad.json
agent:
  max_new_tokens: 200
  model_name: allenai/Olmo-3.1-32B-Instruct
  temperature: 1.0
  thinking_budget: 150
  type: mono_llm
experiment:
  replicates: 10
  time_horizon: 10
paths:
  experiment_dir: base_configs/farming_basic
  log_file: experiments/20260524_farm_warn_noexp_novar/model_name_Olmo-3.1-32B-Instruct/ordinal_helpful_high_scale/output.log
subtasks:
- id: 0
  name: DeterministicFarmBandit
  params:
    actions:
    - id: 0
      mean: 75
      std_dev: 0
    - id: 1
      mean: 50
      std_dev: 0
    - id: 2
      mean: 25
      std_dev: 0
  type: bandit
world:
  action_suffix: Field
  prompt_template_path: src/templates/warn_budg_summ_no_explore_instruct.jinja2
  task_prompt: You are a farmer who owns 3 fields. Each action corresponds to planting
    your crop in a different field. Each field is associated with a Gaussian distribution
    with a fixed but unknown mean. At each time step, you will select a field and
    receive a reward drawn from the associated distribution. Your goal is to maximize
    your reward across all of your turns.
