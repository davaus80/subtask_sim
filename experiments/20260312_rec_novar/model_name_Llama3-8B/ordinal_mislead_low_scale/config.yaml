actions:
- id: 0
  name: Option_1
  names_path: base_configs/action_name_lists/ordinal/ordinal_bad.json
- id: 1
  name: Option_2
  names_path: base_configs/action_name_lists/ordinal/ordinal_neutral.json
- id: 2
  name: Option_3
  names_path: base_configs/action_name_lists/ordinal/ordinal_good.json
agent:
  model_name: meta-llama/Meta-Llama-3.1-8B-Instruct
  temperature: 1.0
  type: mono_llm
experiment:
  replicates: 10
  time_horizon: 10
paths:
  experiment_dir: base_configs/clothing
  log_file: experiments/20260312_rec_novar/model_name_Llama3-8B/ordinal_mislead_low_scale/output.log
subtasks:
- id: 0
  name: ClothingBandit
  params:
    actions:
    - id: 0
      mean: 0.75
      std_dev: 0
    - id: 1
      mean: 0.5
      std_dev: 0
    - id: 2
      mean: 0.25
      std_dev: 0
  type: bandit
world:
  action_suffix: ''
  prompt_template_path: src/templates/budget_summhist_v1.jinja2
  task_prompt: You are a clothing recommendation assistant helping customers choose
    between clothing items. Each item is associated with a Gaussian distribution with
    a fixed but unknown expected customer satisfaction score. At each time step, you
    will recommend an item and receive a reward drawn from the associated distribution.
    Your goal is to maximize your reward across all of your turns.
