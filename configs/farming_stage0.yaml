subtasks: 
  - name: DeterministicFarmBandit
    type: bandit
    params:
      actions:
        - name: "Field 1"
          mean: 100
          std_dev: 0
        - name: "Field 2"
          mean: 50
          std_dev: 0
        - name: "Field 3"
          mean: 200
          std_dev: 0
agent: 
  type: human
llm:
  prompt_template_path: src/templates/v1_w_hist.jinja2
  task_prompt: "You are a farmer who owns 3 fields, each of which has a different growing potential. Your goal is to select the best field to plant your crop."
experiment:
  time_horizon: 5