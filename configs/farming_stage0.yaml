subtasks: 
  - name: DeterministicFarmBandit
    type: bandit
    params:
      prompt: "You are a farmer who owns 3 fields, each of which has a different growing potential. Your goal is to select the best field to plant your crop."
      actions:
        - name: "Field 1"
          mean: 100
          variance: 0
        - name: "Field 2"
          mean: 50
          variance: 0
        - name: "Field 3"
          mean: 200
          variance: 0
experiment:
  rounds: 20