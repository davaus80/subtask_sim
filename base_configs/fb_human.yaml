    type: bandit
    params:
      actions:
        - id: 0
          mean: 100
          std_dev: 0
        - id: 1
          mean: 50
          std_dev: 0
        - id: 2
          mean: 200
          std_dev: 0
        - id: 3
          mean: 25
          std_dev: 0
        - id: 4
          mean: 150
          std_dev: 0
actions:
  - id: 0
    name: "Field_1"
  - id: 1
    name: "Field_2"
  - id: 2
    name: "Field_3"
  - id: 3
    name: "Field_4"
  - id: 4
    name: "Field_5"
