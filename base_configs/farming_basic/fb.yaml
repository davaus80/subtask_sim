subtasks: 
  - name: DeterministicFarmBandit
    id: 0
    type: bandit
    params:
      actions:
        - id: 0
          mean: 100
          std_dev: 0
        - id: 1
          mean: 50
          std_dev: 0
        - id: 2
          mean: 200
          std_dev: 0
actions:
  - id: 0
    name: "Field_1"
  - id: 1
    name: "Field_2"
  - id: 2
    name: "Field_3"
agent: 
  type: mono_llm
  model_name: "Qwen/Qwen3-8B"
world:
  action_suffix: "Field"
  prompt_template_path: src/templates/v1_w_hist.jinja2
  task_prompt: "You are a farmer who owns 3 fields. Each action corresponds to planting in a specific field. Each field is associated with a Gaussian distribution with a fixed but unknown mean. At each time step, you will select a field and receive a reward drawn from the associated distribution. Your goal is to select which field to plant in in order to maximize your reward across all of your turns."
experiment:
  time_horizon: 10
paths:
  experiment_dir: base_configs/farming_basic