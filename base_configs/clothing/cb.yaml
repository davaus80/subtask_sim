subtasks:
  - name: ClothingBandit
    id: 0
    type: bandit
    params:
      actions:
        - id: 0
          mean: 200
          std_dev: 0
        - id: 1
          mean: 150
          std_dev: 0
        - id: 2
          mean: 100
          std_dev: 0
actions:
  - id: 0
    name: "Option_1"
  - id: 1
    name: "Option_2"
  - id: 2
    name: "Option_3"
agent:
  type: mono_llm
  model_name: "Qwen/Qwen3-8B"
  temperature: 1.0
world:
  action_suffix: ""
  prompt_template_path: src/templates/v1_w_hist.jinja2
  task_prompt: "You are recommendation engine that chooses advertisements to display to users when they visit your webpage. You will be presented with 3 items and a user context. Selecting an item corresponds to recommending it to the user. Each item is associated with a Gaussian distribution with a fixed but unknown mean. At each time step, you will select an item and receive a reward drawn from the associated distribution. Your goal is to maximize your reward across all of your turns."
experiment:
  time_horizon: 10
  replicates: 10
paths:
  experiment_dir: base_configs/clothing
